name: Build APK

# Builds the installable APK. GitHub's runners already have the Android SDK, so
# nothing needs installing — which is the whole reason the build lives here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # The repo has no gradle-wrapper.jar checked in (a binary in git that
      # nobody can review), so generate the wrapper from the runner's own
      # Gradle before building.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        id: apk
        run: |
          SRC=app/build/outputs/apk/debug/app-debug.apk
          test -f "$SRC" || { echo "APK not found"; exit 1; }
          mkdir -p out
          cp "$SRC" "out/gamia23-blocks.apk"
          echo "size=$(du -h out/gamia23-blocks.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamia23-blocks-apk
          path: out/gamia23-blocks.apk
          if-no-files-found: error

      # A Release gives a permanent, phone-friendly download link, which an
      # artifact does not: artifacts are zipped and need a GitHub login to
      # fetch, so they are useless for sending to a player.
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Gamia23 Blocks — latest build"
          body: |
            Install on Android: download `gamia23-blocks.apk` below, open it,
            and allow installing from this source when prompted.

            Built from ${{ github.sha }} (${{ steps.apk.outputs.size }}).

            Signed with Android's standard debug key — fine for sideloading,
            not for the Play Store.
          files: out/gamia23-blocks.apk
          make_latest: true
